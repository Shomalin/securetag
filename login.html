<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Owner login</title>
</head>
<body>
  <div class="wrap">
    <nav><a class="logo" href="index.html">SecureTag</a></nav>

    <div class="panel" style="max-width: 420px; margin: 24px auto;">
      <h2 id="title">Log in</h2>
      <div id="error" class="banner lost" hidden></div>

      <label id="nameLabel" for="name" hidden>Name</label>
      <input id="name" autocomplete="name" hidden>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">

      <p><button class="btn" id="submit">Log in</button></p>
      <p class="muted"><a href="#" id="switch">New here? Create an account</a></p>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
